<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in | ThinkTrail.AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<style>
:root{--ink:#16261C;--forest:#2F5233;--amber:#D98E3F;--paper:#FAF6EC;--rule:#E4DCC8;--muted:#6B7264;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#FAF6EC 0%,#E9F0E4 100%);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
.auth{width:min(430px,100%);background:#fff;padding:42px;border:1px solid var(--rule);box-shadow:0 18px 50px rgba(22,38,28,.12);}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:42px;}
.logo-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--amber);font-family:'Source Serif 4',serif;font-size:19px;}
h1{font:700 38px/1.1 'Source Serif 4',serif;margin-bottom:10px;}
.intro{color:var(--muted);margin-bottom:28px;}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px;}
input{width:100%;padding:13px 14px;border:1px solid var(--rule);border-radius:6px;font:inherit;background:#fff;}
input:focus{outline:2px solid var(--amber);outline-offset:1px;}
button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:6px;background:var(--forest);color:#fff;font:600 15px 'IBM Plex Sans',sans-serif;cursor:pointer;}
button:disabled{opacity:.65;cursor:wait;}
.oauth-divider{display:flex;align-items:center;gap:12px;margin:24px 0 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;}
.oauth-divider::before,.oauth-divider::after{content:"";height:1px;flex:1;background:var(--rule);}
.oauth-buttons{display:grid;gap:10px;}
.oauth-button{margin-top:0;background:#fff;color:var(--ink);border:1px solid var(--rule);}
.oauth-button:hover{border-color:var(--forest);background:#F7FAF5;}
.switch{margin-top:18px;text-align:center;color:var(--muted);font-size:14px;}
.switch button{width:auto;margin:0;padding:0;background:none;color:var(--forest);font-size:inherit;text-decoration:underline;}
.message{min-height:22px;margin-top:16px;color:var(--forest);font-size:14px;}
.message.error{color:#A23B2A;}
</style>
</head>
<body>
<main class="auth">
  <div class="logo"><div class="logo-mark">T</div>ThinkTrail.AI</div>
  <h1 id="title">Welcome back.</h1>
  <p class="intro" id="intro">Sign in with your email and password.</p>
  <form id="authForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    <button id="submitButton" type="submit">Sign in</button>
  </form>
  <div class="oauth-divider">or continue with</div>
  <div class="oauth-buttons">
    <button class="oauth-button" type="button" data-provider="google">Continue with Google</button>
    <button class="oauth-button" type="button" data-provider="apple">Continue with Apple</button>
    <button class="oauth-button" type="button" data-provider="azure">Continue with Microsoft</button>
  </div>
  <p class="switch"><span id="switchText">New to ThinkTrail.AI?</span> <button id="switchButton" type="button">Create an account</button></p>
  <p class="message" id="message" role="status"></p>
</main>
<script>
let isSignUp = false;
const form = document.getElementById('authForm');
const title = document.getElementById('title');
const intro = document.getElementById('intro');
const submitButton = document.getElementById('submitButton');
const switchText = document.getElementById('switchText');
const switchButton = document.getElementById('switchButton');
const message = document.getElementById('message');
const passwordInput = document.getElementById('password');
const oauthButtons = document.querySelectorAll('[data-provider]');

supabaseClient.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = '../';
});

switchButton.addEventListener('click', () => {
  isSignUp = !isSignUp;
  title.textContent = isSignUp ? 'Create your account.' : 'Welcome back.';
  intro.textContent = isSignUp ? 'Create a password to get started.' : 'Sign in with your email and password.';
  submitButton.textContent = isSignUp ? 'Create account' : 'Sign in';
  switchText.textContent = isSignUp ? 'Already have an account?' : 'New to ThinkTrail.AI?';
  switchButton.textContent = isSignUp ? 'Sign in' : 'Create an account';
  passwordInput.autocomplete = isSignUp ? 'new-password' : 'current-password';
  message.textContent = '';
});

oauthButtons.forEach((button) => {
  button.addEventListener('click', async () => {
    message.className = 'message';
    message.textContent = 'Redirecting...';
    oauthButtons.forEach((item) => { item.disabled = true; });
    const options = window.location.protocol === 'http:' || window.location.protocol === 'https:'
      ? { redirectTo: new URL('../', window.location.href).href }
      : {};
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: button.dataset.provider,
      options
    });
    if (error) {
      message.className = 'message error';
      message.textContent = error.message;
      oauthButtons.forEach((item) => { item.disabled = false; });
    }
  });
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.className = 'message';
  message.textContent = 'Working...';
  submitButton.disabled = true;
  const email = document.getElementById('email').value.trim();
  const password = passwordInput.value;
  let result;

  if (isSignUp) {
    result = await supabaseClient.auth.signUp({ email, password });
  } else {
    result = await supabaseClient.auth.signInWithPassword({ email, password });
  }

  submitButton.disabled = false;

  if (result.error) {
    message.className = 'message error';
    message.textContent = result.error.message;
    return;
  }

  window.location.href = '../';
});
</script>
</body>
</html>
